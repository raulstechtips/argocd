suite: externalRegistrySecrets
templates:
  - templates/external-registry-secrets.yaml
tests:
  - it: renders nothing when the list is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one document per entry with the repository label and literal password template
    set:
      infisical.projectSlug: fake-project
      externalRegistrySecrets:
        - name: ghcr
          environmentSlug: dev
          secretPath: /registries/ghcr
          url: ghcr.io/example
          usernameKey: GHCR_USER
          passwordKey: GHCR_TOKEN
          enableOCI: true
        - name: git
          environmentSlug: dev
          secretPath: /registries/git
          url: https://git.example.test/repo.git
          usernameKey: GIT_USER
          passwordKey: GIT_TOKEN
          type: git
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: repo-ghcr
        documentIndex: 0
      - equal:
          path: metadata.name
          value: repo-git
        documentIndex: 1
      - equal:
          path: spec.targets[0].metadata.labels["argocd.argoproj.io/secret-type"]
          value: repository
      - equal:
          path: spec.targets[0].template.data.password
          value: "{{ .GHCR_TOKEN.Value }}"
        documentIndex: 0
      - equal:
          path: spec.targets[0].template.data.username
          value: "{{ .GHCR_USER.Value }}"
        documentIndex: 0
      - equal:
          path: spec.targets[0].template.data.enableOCI
          value: "true"
        documentIndex: 0
      - equal:
          path: spec.targets[0].template.data.type
          value: helm
        documentIndex: 0
      - equal:
          path: spec.targets[0].template.data.enableOCI
          value: "false"
        documentIndex: 1
      - equal:
          path: spec.sources[0].projectSlug
          value: fake-project

  - it: requires infisical.projectSlug when entries exist
    set:
      externalRegistrySecrets:
        - name: x
          environmentSlug: dev
          secretPath: /x
          url: ghcr.io/x
          usernameKey: U
          passwordKey: P
    asserts:
      - failedTemplate:
          errorMessage: infisical.projectSlug is required when externalRegistrySecrets is set
