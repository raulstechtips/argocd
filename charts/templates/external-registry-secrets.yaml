{{- range .Values.externalRegistrySecrets }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: repo-{{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ $.Values.infisical.authRef.name }}
    namespace: {{ $.Values.infisical.authRef.namespace }}
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when externalRegistrySecrets is set" $.Values.infisical.projectSlug | quote }}
      environmentSlug: {{ .environmentSlug | quote }}
      secretPath: {{ .secretPath | quote }}
  targets:
    - name: repo-{{ .name }}
      namespace: {{ $.Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      template:
        engineVersion: v1
        data:
          type: {{ .type | default "helm" | quote }}
          name: {{ .name | quote }}
          url: {{ .url | quote }}
          enableOCI: {{ .enableOCI | default false | toString | quote }}
          username: {{ printf "{{ .%s.Value }}" .usernameKey | quote }}
          password: {{ printf "{{ .%s.Value }}" .passwordKey | quote }}
{{- end }}
