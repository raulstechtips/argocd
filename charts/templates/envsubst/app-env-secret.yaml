{{- if .Values.envsubst.enabled }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-argocd-app-env
  namespace: {{ .Release.Namespace }}
spec:
  resyncInterval: 60
  hostAPI: {{ required "envsubst.infisical.hostAPI is required when envsubst.enabled=true" .Values.envsubst.infisical.hostAPI | quote }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: {{ required "envsubst.infisical.projectSlug is required when envsubst.enabled=true" .Values.envsubst.infisical.projectSlug | quote }}
        envSlug: {{ required "envsubst.infisical.envSlug is required when envsubst.enabled=true" .Values.envsubst.infisical.envSlug | quote }}
        secretsPath: "/argocd/apps/env"
        recursive: true
  managedKubeSecretReferences:
    - secretName: argocd-app-env
      secretNamespace: argocd
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          ARGOCD_ENV_ARGOCD_PROD_DOMAIN: "{{ "{{" }} .ARGOCD_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_DOMAIN: "{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_INFISICAL_DEV_GATEWAY_NAME: "{{ "{{" }} .INFISICAL_DEV_GATEWAY_NAME.Value }}"
          ARGOCD_ENV_INFISICAL_DEV_RELAY_NAME: "{{ "{{" }} .INFISICAL_DEV_RELAY_NAME.Value }}"
          ARGOCD_ENV_INFISICAL_PROD_DOMAIN: "{{ "{{" }} .INFISICAL_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_INFISICAL_UAT_DOMAIN: "{{ "{{" }} .INFISICAL_APP_UAT.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_INFISICAL_PROD_HOST_API: "https://{{ "{{" }} .INFISICAL_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}/api"
          ARGOCD_ENV_INFISICAL_PROJECT_SLUG: "{{ "{{" }} .INFISICAL_PROJECT_SLUG.Value }}"
          ARGOCD_ENV_INFISICAL_ENV_SLUG: "{{ "{{" }} .INFISICAL_ENV_SLUG.Value }}"
          ARGOCD_ENV_INFISICAL_PG_ADMIN_USERNAME: "{{ "{{" }} .INFISICAL_PG_ADMIN_USERNAME.Value }}"
          ARGOCD_ENV_INFISICAL_PG_ADMIN_PASSWORD: "{{ "{{" }} .INFISICAL_PG_ADMIN_PASSWORD.Value }}"
          ARGOCD_ENV_INFISICAL_REDIS_PASSWORD: "{{ "{{" }} .INFISICAL_REDIS_PASSWORD.Value }}"
          ARGOCD_ENV_INFISICAL_ENCRYPTION_KEY: "{{ "{{" }} .INFISICAL_ENCRYPTION_KEY.Value }}"
          ARGOCD_ENV_INFISICAL_AUTH_SECRET: "{{ "{{" }} .INFISICAL_AUTH_SECRET.Value }}"
          ARGOCD_ENV_AUTHENTIK_PROD_DOMAIN: "{{ "{{" }} .AUTHENTIK_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_S3_PROD_DOMAIN: "{{ "{{" }} .S3_CONSOLE.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_S3_PROD_API_DOMAIN: "{{ "{{" }} .S3_API.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_LONGHORN_PROD_DOMAIN: "{{ "{{" }} .LONGHORN_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_TRAEFIK_PROD_DOMAIN: "{{ "{{" }} .TRAEFIK_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_TRAEFIK_LOAD_BALANCER_IP: "{{ "{{" }} .TRAEFIK_LOAD_BALANCER_IP.Value }}"
          ARGOCD_ENV_CLOUDFLARE_EMAIL: "{{ "{{" }} .CLOUDFLARE_EMAIL.Value }}"
          ARGOCD_ENV_CLOUDFLARE_API_TOKEN: "{{ "{{" }} .CLOUDFLARE_API_TOKEN.Value }}"
          ARGOCD_ENV_GITHUB_HOOKS_IP: "{{ "{{" }} .GITHUB_HOOKS_IP.Value }}"
          ARGOCD_ENV_VPN_IP: "{{ "{{" }} .VPN_IP.Value }}"
          ARGOCD_ENV_JENKINS_LIVE_DOMAIN: "{{ "{{" }} .JENKINS_LIVE_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_JENKINS_PROD_DOMAIN: "{{ "{{" }} .JENKINS_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_S3_LIVE_API_DOMAIN: "{{ "{{" }} .S3_LIVE_API.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_INFISICAL_PROJECT_ID: "{{ "{{" }} .INFISICAL_PROJECT_ID.Value }}"
          ARGOCD_ENV_CONTAINER_REGISTRY_DOMAIN: "{{ "{{" }} .CONTAINER_REGISTRY_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_OAUTH2_PROXY_PROD_DOMAIN: "{{ "{{" }} .OAUTH2_PROXY_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_KEYCLOAK_PROD_DOMAIN: "{{ "{{" }} .KEYCLOAK_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_KEYCLOAK_LIVE_DOMAIN: "{{ "{{" }} .KEYCLOAK_LIVE_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_ALERTMANAGER_PROD_DOMAIN: "{{ "{{" }} .ALERTMANAGER_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_GRAFANA_PROD_DOMAIN: "{{ "{{" }} .GRAFANA_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
          ARGOCD_ENV_PROMETHEUS_PROD_DOMAIN: "{{ "{{" }} .PROMETHEUS_APP.Value }}.{{ "{{" }} .DOMAIN.Value }}"
{{- end }}
