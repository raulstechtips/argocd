{{- if .Values.envsubst.enabled }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-argocd-harbor-secrets
  namespace: {{ .Release.Namespace }}
spec:
  resyncInterval: 60
  hostAPI: {{ required "envsubst.infisical.hostAPI is required when envsubst.enabled=true" .Values.envsubst.infisical.hostAPI | quote }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: {{ required "envsubst.infisical.projectSlug is required when envsubst.enabled=true" .Values.envsubst.infisical.projectSlug | quote }}
        envSlug: {{ required "envsubst.infisical.envSlug is required when envsubst.enabled=true" .Values.envsubst.infisical.envSlug | quote }}
        secretsPath: "/harbor"
        recursive: true
  managedKubeSecretReferences:
    - secretName: argocd-harbor-secrets
      secretNamespace: {{ .Release.Namespace }}
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          ARGOCD_ENV_PG_HARBOR_ADMIN_PASSWORD: "{{ "{{" }} .PG_HARBOR_ADMIN_PASSWORD.Value }}"
          ARGOCD_ENV_HARBOR_REDIS_PASSWORD: "{{ "{{" }} .HARBOR_REDIS_PASSWORD.Value }}"
{{- end }}
