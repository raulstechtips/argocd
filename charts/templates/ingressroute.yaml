{{- if .Values.ingressRoute.enabled }}
{{- $host := required "ingressRoute.host is required when ingressRoute.enabled is true" .Values.ingressRoute.host }}
{{- $tls := required "ingressRoute.tlsSecretName is required when ingressRoute.enabled is true" .Values.ingressRoute.tlsSecretName }}
{{- $entryPoints := .Values.ingressRoute.entryPoints }}
{{- if not $entryPoints }}{{ fail "ingressRoute.entryPoints is required when ingressRoute.enabled is true" }}{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingress
  namespace: {{ .Release.Namespace }}
  {{- with .Values.ingressRoute.ingressClass }}
  annotations:
    kubernetes.io/ingress.class: {{ . | quote }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml $entryPoints | nindent 4 }}
  routes:
    - match: {{ printf "Host(`%s`)" $host | quote }}
      kind: Rule
      priority: 10
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: argocd-server
          port: 80
    - match: {{ printf "Host(`%s`) && Header(`Content-Type`, `application/grpc`)" $host | quote }}
      kind: Rule
      priority: 11
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: {{ $tls | quote }}
{{- end }}
