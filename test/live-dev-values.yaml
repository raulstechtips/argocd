# Draft development values. Supply host, TLS name and Infisical fields at runtime.
envsubst:
  enabled: true
ingressRoute:
  enabled: true
argo-cd:
  repoServer:
    # Source: overlays/cmp-kustomize-envsubst-sidecar.yaml.
    extraContainers:
      - name: kustomize-envsubst
        image: ubuntu:22.04
        command: [/var/run/argocd/argocd-cmp-server]
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: plugin.yaml
            name: cmp-kustomize-envsubst
          - mountPath: /tmp
            name: cmp-tmp
        env:
          - name: ARGOCD_APP_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['app.kubernetes.io/name']
          - name: ARGOCD_APP_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        envFrom:
          - secretRef:
              name: argocd-app-env
          - secretRef:
              name: argocd-harbor-secrets
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            cpu: 500m
        lifecycle:
          postStart:
            exec:
              command:
                - bash
                - -c
                - |
                  # Install dependencies
                  apt-get update
                  apt-get install -y gettext curl jq

                  # Install kustomize
                  KUSTOMIZE_VERSION=v5.8.0
                  curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
                  mv /tmp/kustomize /usr/local/bin/
                  chmod +x /usr/local/bin/kustomize

                  # Install Helm
                  HELM_VERSION=v3.14.2
                  curl -sL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
                  mv /tmp/linux-amd64/helm /usr/local/bin/
                  chmod +x /usr/local/bin/helm

                  # Fix socket permissions in the background
                  (
                    # Wait for socket to be created
                    while true; do
                      if [ -S /home/argocd/cmp-server/plugins/kustomize-envsubst.sock ]; then
                        chmod 777 /home/argocd/cmp-server/plugins/kustomize-envsubst.sock
                        echo "Fixed socket permissions"
                        break
                      fi
                      echo "Waiting for socket creation..."
                      sleep 1
                    done
                  ) &
    volumes:
      - name: cmp-kustomize-envsubst
        configMap:
          name: cmp-kustomize-envsubst
      - name: cmp-tmp
        emptyDir: {}
