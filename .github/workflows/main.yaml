name: main

# Manual backup pipeline: Jenkins builds this repo with the shared library (see Jenkinsfile).
# Run this workflow by hand only when Jenkins is unavailable: test, then scan, then publish.
# The scan only warns. A HIGH or CRITICAL finding does not stop the publish.
on:
  workflow_dispatch:

concurrency: main-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  scan:
    needs: test
    uses: ./.github/workflows/scan.yaml

  publish:
    needs: scan
    uses: ./.github/workflows/release.yaml
    permissions:
      contents: read
      packages: write
