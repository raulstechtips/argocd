name: retention

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print decisions, do not delete
        type: boolean
        default: true
  push:
    branches: ['**']
    paths:
      - '.github/workflows/retention.yaml'
      - 'scripts/retention.sh'

permissions:
  contents: read

concurrency:
  group: retention
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # A broken classifier stops the run before any job can delete.
      - name: Test the retention script
        run: bash test/retention_test.sh

  # Only this job can delete. push and unknown events never reach it.
  retention-apply:
    needs: test
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Delete branch chart versions older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/retention.sh --apply

  retention-dry-run:
    needs: test
    if: ${{ !(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Print retention decisions without deleting
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/retention.sh --dry-run
